name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scripts
        run: python -I tests/run_tests.py
      - name: Repository hygiene
        run: python -I tests/check_hygiene.py
